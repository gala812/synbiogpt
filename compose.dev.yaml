services:
  backend:
    image: synbiogpt-backend-dev:local
    restart: "no"
    environment:
      ENV: dev
      CORS_ALLOW_ORIGIN: "*"
    volumes:
      - type: bind
        source: ./backend
        target: /app/backend
    ports:
      - "8080:8080"

  frontend:
    build:
      target: dev
    image: synbiogpt-frontend-dev:local
    restart: "no"
    command: npm run dev -- --port 5173
    ports: !override
      - "${SYNBIO_DEV_PORT:-5173}:5173"
    volumes:
      - type: bind
        source: ./src
        target: /app/src
      - type: bind
        source: ./static
        target: /app/static
      - type: bind
        source: ./vite.config.ts
        target: /app/vite.config.ts
        read_only: true
      - type: bind
        source: ./svelte.config.js
        target: /app/svelte.config.js
        read_only: true
